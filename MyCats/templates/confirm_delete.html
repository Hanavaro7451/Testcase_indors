{% extends 'base.html' %}

{% block title %}Подтвердить удаление - MyCats{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; text-align: center;">
    <h2>⚠️ Удалить кошку?</h2>
    
    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0;">
        <p>Вы уверены, что хотите удалить <strong>{{ cat.name }}</strong>?</p>
        <p style="font-size: 14px; color: #666; margin-top: 10px;">Это действие не может быть отменено.</p>
    </div>
    
    <form method="post" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="btn" style="background: #dc3545; margin-right: 10px;">🗑️ Удалить</button>
    </form>
    <a href="{% url 'my-cats' %}" class="btn">Отмена</a>
</div>
{% endblock %}
