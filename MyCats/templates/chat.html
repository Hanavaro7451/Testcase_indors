{% extends 'base.html' %}

{% block title %}Сообщения - MyCats{% endblock %}

{% block content %}
<h2>Сообщения</h2>

<div style="margin-bottom: 20px; display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
    <div style="background: #f8f9fa; padding: 20px; border-radius: 10px;">
        <h3>Адресаты</h3>
        <select id="recipient" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.username }}</option>
            {% endfor %}
        </select>
        <div style="margin-top: 20px;">
            <label for="messageText">Сообщение:</label>
            <textarea id="messageText" rows="5" placeholder="Введите текст" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ddd;"></textarea>
        </div>
        <button id="sendBtn" class="btn-primary" style="margin-top: 15px;">Отправить</button>
        <div id="status" style="margin-top: 15px; color: #444;"></div>
    </div>
    <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; display: flex; flex-direction: column;">
        <h3>История сообщений</h3>
        <div id="messages" style="overflow-y: auto; flex: 1; min-height: 280px; border: 1px solid #ddd; border-radius: 8px; padding: 15px; background: white;"></div>
    </div>
</div>

<script>
    const messagesArea = document.getElementById('messages');
    const recipientSelect = document.getElementById('recipient');
    const messageInput = document.getElementById('messageText');
    const sendBtn = document.getElementById('sendBtn');
    const statusBlock = document.getElementById('status');

    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl = `${protocol}://${window.location.host}/ws/chat/`;
    const socket = new WebSocket(wsUrl);

    function appendMessage(data, incoming = true) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-box';
        wrapper.style.background = incoming ? '#f8f9fa' : '#e7f1ff';
        wrapper.innerHTML = `
            <p><strong>${data.sender}</strong> → <strong>${data.recipient}</strong></p>
            <p>${data.content}</p>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">${new Date(data.timestamp).toLocaleString()}</p>
        `;
        messagesArea.prepend(wrapper);
    }

    socket.onopen = () => {
        statusBlock.textContent = 'WebSocket подключен';
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        appendMessage(data, data.sender !== '{{ user.username }}');
    };

    socket.onclose = () => {
        statusBlock.textContent = 'WebSocket отключен';
    };

    socket.onerror = () => {
        statusBlock.textContent = 'Ошибка websocket';
    };

    sendBtn.addEventListener('click', () => {
        const recipient = recipientSelect.value;
        const content = messageInput.value.trim();
        if (!recipient || !content) {
            return;
        }
        const payload = { recipient, content };
        socket.send(JSON.stringify(payload));
        messageInput.value = '';
        appendMessage({ sender: 'Я', recipient: recipientSelect.options[recipientSelect.selectedIndex].text, content, timestamp: new Date().toISOString() }, false);
    });
</script>
{% endblock %}
