services:
   db:
      image: mariadb:latest
      container_name: data_base
      restart: always
      environment:
         MYSQL_ROOT_PASSWORD: rootpassword
         MYSQL_DATABASE: cats_db
         MYSQL_USER: cats_user
         MYSQL_PASSWORD: 1234
      ports:
         - "3306:3306"
      volumes:
         - db_data:/var/lib/mysql
   
   redis:
      image: redis:alpine
      container_name: redis
      restart: always
      ports:
         - "6379:6379"
   
   backend:
      build: ./MyCats/
      container_name: backend
      restart: always
      ports:
         - "8080:8000"
      depends_on:
         - db
         - redis
      env_file:
         - .env
      volumes:
         - static_volume:/app/static
         - ./MyCats:/app

volumes:
   static_volume:
